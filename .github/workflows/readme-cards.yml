name: README cards

# Every morning: refresh the contribution data, re-render the SVG cards, commit if anything changed.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install font tools and Pillow
        run: pip install "fonttools==4.*" brotli pillow

      - name: Fetch contributions and featured repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github_data.py

      - name: Render README cards (hero, tiles, activity, repos, graph)
        run: python scripts/render_readme_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh README cards"
            git push
          fi
