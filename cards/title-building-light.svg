<svg xmlns="http://www.w3.org/2000/svg" width="880.000" height="58" viewBox="0 0 880.000 58" role="img" aria-label="What I&#x27;m building"><title>What I&#x27;m building</title><style>@font-face{font-family:'Inter Display';src:url(data:font/woff;base64,) format('woff')}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes grow{from{transform:scaleY(0)}to{transform:none}}@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.8)}100%{opacity:1;transform:none}}@keyframes cell{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}@keyframes swing{0%{opacity:0;transform:translateY(46px) rotate(5deg)}70%{opacity:1;transform:translateY(-4px) rotate(-.6deg)}100%{opacity:1;transform:none}}@keyframes nudge{0%,70%,100%{transform:none}82%{transform:translate(3px,-3px)}}@keyframes ring{0%{opacity:.7;transform:scale(.2)}100%{opacity:0;transform:scale(1.6)}}@keyframes sweep{0%{transform:translateX(0)}40%,100%{transform:translateX(640px)}}@keyframes show{from,to{opacity:1}}@keyframes hold{from,to{opacity:0}}@keyframes print{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}.fade{animation:fade .8s ease-out both}.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.34,1.45,.64,1) both}.cell{transform-box:fill-box;transform-origin:center;animation:cell .45s cubic-bezier(.34,1.45,.64,1) both}.swing{transform-box:fill-box;transform-origin:50% 100%;animation:swing .9s cubic-bezier(.34,1.45,.64,1) both}.nudge{animation:nudge 2.8s cubic-bezier(.2,.8,.2,1) infinite}.ring{transform-box:fill-box;transform-origin:100% 0;opacity:0;animation:ring 2.4s ease-out 3}.sweep{animation:sweep 7s cubic-bezier(.2,.8,.2,1) infinite}.print{animation:print .4s ease-out both}.tick{opacity:0;animation:show .06s linear}.last{animation:hold 0s linear backwards}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="rise" style="animation-delay:1.90s"><text x="2.0" y="38.0" font-family="Inter Display" font-size="28" fill="#121212" text-anchor="start" letter-spacing="-.6">What I&#x27;m</text><text x="116.5" y="38.0" font-family="Inter Display" font-size="28" fill="#3392ff" text-anchor="start" letter-spacing="-.6">building</text></g></svg>